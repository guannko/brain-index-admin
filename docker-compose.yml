version: '3.8'

services:
  # PostgreSQL (Core DB: Clients, Bots, Billing)
  postgres:
    image: postgres:15-alpine
    container_name: bi_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: brain_index_core
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d brain_index_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (Logs, Chat History, Audit)
  mongo:
    image: mongo:6.0
    container_name: bi_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    volumes:
      - ./infra/mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache, Heartbeat, Sessions)
  redis:
    image: redis:7-alpine
    container_name: bi_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass admin_password
    volumes:
      - ./infra/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express (Dev UI - optional)
  mongo-express:
    image: mongo-express
    container_name: bi_mongo_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_password
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin_password@mongo:27017/
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data:
